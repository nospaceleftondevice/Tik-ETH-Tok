<ion-content fullscreen [class.matrix-bg-on]="showMatrixBg">
    <!-- Shield overlay -->
    <div 
      *ngIf="showShield" 
      style="
        position: fixed;
        top: 30;
        left: 0;
        width: 100vw;
        height: 90vh;
        background: rgba(0, 0, 0, 0.5); /* Semi-transparent black */
        z-index: 10001;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end; /* Align content at the top */
        padding-bottom: 20px; /* Space from the bottom of the viewport */
        pointer-events: auto;">
      <div *ngIf="showControls" style="text-align: center;">
      <div style="text-align: center; color: white;">
        <p>Slide to disable shield</p>
        <ion-range
          (ionChange)="disableShield()"
          min="0"
          max="100"
          step="1"
          value="0"
          style="
            width: 80%;
            --bar-background-active: #3880ff;
            --bar-background: #999;
            --knob-background: #fff;
          ">
        </ion-range>
      </div>
        <!-- Camera Button -->
      <ion-button 
        (click)="handleCamera()" 
        color="primary"
        style="margin-top: 10px; width: 60%; text-align: center;">
        Camera On
      </ion-button>
      </div>
    </div>

  <div 
    *ngIf="showHeaderDiv"
    style="position: fixed; height: 30px; top: -10px; width: 100%; text-align: center; z-index: 10000; background: rgba(0, 0, 0, 0.5); color: white; padding: 10px;"
    (click)="handleWeb3Auth()">
    <ng-container *ngIf="chainName !== 'Unknown Chain'; else notConnected">
      Connected to {{ chainName }}
      <ion-icon style="position: absolute; top: 12px; color: #3880ff;" name="log-out-outline"></ion-icon>
    </ng-container>
    <ng-template #notConnected>
      You may not be connected
      <ion-icon style="position: absolute; top: 12px; color: #3880ff;" name="log-in-outline"></ion-icon>
    </ng-template>
  </div>

  <div 
    *ngIf="showHeaderDiv"
    style="position: fixed; height: 30px; top: -10px; width: 100%; text-align: center; z-index: 10000; background: rgba(0, 0, 0, 0.5); color: white; padding: 10px;"
    (click)="handleCamera()">
    <ng-container>
      <ion-icon style="position: absolute; top: 12px; color: #3880ff;" name="log-out-outline"></ion-icon>
    </ng-container>
  </div>

  <ion-slides #slides (ionSlideDidChange)="onSlideDidChange()" (ionSlideTouchStart)="onSlideTouchStart()" [options]="slideOpts">
    <ion-slide *ngFor="let video of videoList; let i = index" [attr.id]="video.url">
      <!--
        title= and data-mix-info= are not for the user's eyes here — they
        carry text that pauseInactiveSlides() reads back via getAttribute
        and renders into the absolute-positioned project/description
        overlay at the bottom of each slide. Title was hardcoded to
        userName (=== literal "maxb" from the backend); now it's the
        loaded session name. Description was the mp4 filename
        (video.userPic); now it's "Artist – Title × Artist – Title"
        composed from the new x_/y_ metadata fields (mixInfo helper
        falls back to the filename when no metadata was extracted).
      -->
      <video loop playsinline muted preload="metadata" style="background-color: #ccc1c5;" src="{{video.url}}"
      [attr.title]="video.session || video.userName"
      [attr.data-mix-info]="mixInfo(video)"></video>
      <!--button (click)="loadMoreVideos()" style="position: absolute; top: 20px; left: 10px">Load More</button-->
      <app-feed *ngIf="i !== 0" [video]="video" [listReversed]="videoListReversed"
                (rated)="onFeedRated($event)"
                (reverseToggled)="toggleVideoListOrder()"
                (matrixToggled)="toggleMatrixBg()"
                (searchToggled)="toggleSearchBar()"></app-feed>
      <app-footer [video]="video"></app-footer>
    </ion-slide>

  <audio id="background-audio" autoplay muted>
    <source src="https://your.cmptr.cloud:2017/2-seconds-of-silence.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <!--  overflow: hidden; opacity: 0.70; background-color: transparent; width: 70%; height: 174px;" allowTransparency="true"></iframe-->
  <!-- Button to unmute audio -->
  <ion-button *ngIf="showHeaderDiv" (click)="handleWeb3Auth()"
  style="position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);">
    web3auth
  </ion-button>
</ion-slides>

<!--
  Persistent "next slide" arrow at the bottom-most point of the
  viewport. Click = slides.slideNext(), equivalent to a swipe-up on
  the vertical slider. Lives at the ion-content level (not inside a
  slide) so it shows on every slide including the intro. z-index sits
  above the star-rating strip (9999) and the search bar so it stays
  clickable. position: fixed pins it to the viewport so devices with
  a bottom address bar don't push it off-screen during scroll.
-->
<div class="next-slide-arrow"
     (click)="goToNextSlide()"
     style="position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%);
            z-index: 10000; cursor: pointer; padding: 4px 16px;
            background: rgba(0, 0, 0, 0.4); border-radius: 14px;
            display: flex; align-items: center; justify-content: center;"
     role="button"
     aria-label="Next video">
  <ion-icon name="chevron-up-outline" style="color: white; font-size: 22px;"></ion-icon>
</div>

<video class="floating-video" id="float" autoplay loop playsinline muted controls src=""
    style="display: none;position: fixed; top: 0; left: 0; width: 100vw; height: 45vh; z-index: 9998; pointer-events: auto;"></video>

<div>

    <!--
      Matrix behind the feed. Pulled UP by $matrix-bg-offset so the
      matrix's own toolbar and filter row land under #float (the playing
      video, fixed at top:0 height:45vh) and its "N loaded ..." status
      line sits just above this page's searchbar at top:45%.

      Low z-index on purpose: #float is 9998, the searchbar 9999, and the
      feed's action icons are `position:fixed; z-index:9999 !important`,
      so all of them keep working on top of it untouched.
    -->
    <iframe *ngIf="showMatrixBg"
            class="matrix-bg"
            [src]="matrixBgUrl"
            [ngStyle]="matrixBgStyle"
            title="Matrix for the current session"></iframe>

    <!--
      Zoom control for the matrix iframe. Only while it's showing, and
      kept bottom-right so it doesn't sit under the action column on the
      right edge or the video above. Same z-index band as the searchbar,
      well clear of the iframe at -1.
    -->
    <!--
      Rating legend, top of the screen while the matrix is up. The counts
      arrive over postMessage from the embedded matrix page (which
      already computes them) rather than being recomputed here, which
      would mean repeating a query that scans the videos table and a
      12K-row lookup.

      Same z-index band as the searchbar it replaces. The two are never
      up together -- toggling the matrix on closes the search bar.
    -->
    <div class="matrix-legend" *ngIf="showMatrixBg && matrixCounts.length">
      <span class="ml-item" *ngFor="let b of matrixCounts">
        <span class="ml-dot" [style.background]="ratingColor(b.rating)"
              [class.bordered]="b.rating === 0"></span>
        <span class="ml-label">{{ b.rating }}</span>
        <span class="ml-count">{{ b.count }}</span>
      </span>
      <span class="ml-item">
        <span class="ml-dot ml-dot-empty"></span>
        <span class="ml-label">unrated</span>
        <span class="ml-count">{{ matrixUnrated }}</span>
      </span>
      <span class="ml-total">{{ matrixRated }}/{{ matrixTotal }}</span>
    </div>

    <!--
      swiper-no-swiping is Swiper's own opt-out (noSwiping defaults to
      true and looks for exactly this class), which stops a drag here
      being read as a slide change. ion-slides runs direction:'vertical',
      so dragging a VERTICAL slider is precisely the gesture it wants to
      steal. The explicit stopPropagation handlers cover the same ground
      for pointer/mouse, which Swiper also listens for, and touch-action
      in the stylesheet stops the browser scrolling on its own.
    -->
    <div class="matrix-zoom swiper-no-swiping" *ngIf="showMatrixBg"
         (touchstart)="$event.stopPropagation()"
         (touchmove)="$event.stopPropagation()"
         (pointerdown)="$event.stopPropagation()"
         (mousedown)="$event.stopPropagation()">
      <ion-icon name="add-outline"></ion-icon>
      <div class="range-wrap">
        <ion-range min="0.3" max="2" step="0.05" [(ngModel)]="matrixZoom"
                   aria-label="Matrix zoom"></ion-range>
      </div>
      <ion-icon name="remove-outline"></ion-icon>
    </div>


  <ion-searchbar *ngIf="showSearchBar" #searchbar (keyup)="onSearchKeyup($event)" id="search" style="z-index: 9999;position: fixed; top: 0; left: 0; width: 100%;" [placeholder]="searchPlaceholder"></ion-searchbar>
</div>
</ion-content>
