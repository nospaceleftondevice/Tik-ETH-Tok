

<div class="actions" style="z-index: 9999;right: 30px;bottom: 30px;">

  <div (click)="buttonClicked($event,'bookmarks',0)" style="visibility: hidden;">
    <ion-icon size="large" name="bookmarks" [style]="bookmarkStyle"></ion-icon>
  </div>

  <div (click)="buttonClicked($event,'search',0)" style="visibility: hidden; margin-bottom: 48px;">
    <ion-icon size="large" name="search"></ion-icon>
  </div>

 <div (click)="buttonClicked($event,'likes',video.id)" 
     [ngStyle]="{'margin-bottom': getSecondLike(video.likes) === 0 ? '30px' : '40px'}"
     [id]="'video-' + video.id">
  <ion-icon size="large" name="heart" [style]="heartStyle"></ion-icon>
  
  <!-- Always show the ion-icon, but hide the numbers with visibility: hidden if they are 0 -->
  <p [ngStyle]="{'visibility': getFirstLike(video.likes) === 0 ? 'hidden' : 'visible'}">
    {{formatNumber(getFirstLike(video.likes))}}
  </p>
  
  <!--p class="count" style="position: absolute; right: -22px;"
     [ngStyle]="{'visibility': getSecondLike(video.likes) === 0 ? 'hidden' : 'visible'}">
    {{formatNumber(getSecondLike(video.likes))}}
  </p-->
  <p class="count" 
  [ngStyle]="{
    'position': 'absolute',
    'visibility': getSecondLike(video.likes) === 0 ? 'hidden' : 'visible',
    'right': calculateRightOffset(getSecondLike(video.likes))
  }">
 {{formatNumber(getSecondLike(video.likes))}}
</p>
</div>
 
  <div (click)="buttonClicked($event,'comments',video.id)"
     [ngStyle]="{'margin-bottom': getSecondLike(video.comments) === 0 ? '28px' : '36px'}">
    <ion-icon size="large" name="bookmark" [style]="bookmarkStyle"></ion-icon>
    <!-- Always show the ion-icon, but hide the numbers with visibility: hidden if they are 0 -->
    <p [ngStyle]="{'visibility': getFirstLike(video.comments) === 0 ? 'hidden' : 'visible'}">
      {{formatNumber(getFirstLike(video.comments))}}
    </p>
    <p class="count" 
  [ngStyle]="{
    'position': 'absolute',
    'visibility': getSecondLike(video.comments) === 0 ? 'hidden' : 'visible',
    'right': calculateRightOffset(getSecondLike(video.comments))
  }">
      {{formatNumber(getSecondLike(video.comments))}}
    </p>
  </div>
   
  <div (click)="buttonClicked($event,'info',video.id)" style="margin-bottom: 36px;">
    <ion-icon size="large" name="information-circle-outline"></ion-icon>
  </div>
</div>

<!--
  Star-rating strip. Horizontal, bottom-center of the slide, on top of
  the video. Tap any star to record a 1-5 rating; that also implies
  "hearted" (handled in rateVideo). Scroll-past with no tap records 0,
  handled at the slide level in home.page onSlideDidChange.
-->
<div class="star-rating"
     style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; gap: 12px; align-items: center;
            background: rgba(0, 0, 0, 0.45); padding: 8px 16px; border-radius: 24px;">
  <ion-icon *ngFor="let i of stars"
            [name]="i <= userRating ? 'star' : 'star-outline'"
            [style.color]="i <= userRating ? 'gold' : 'white'"
            (click)="rateVideo($event, i)"
            size="large"
            style="cursor: pointer;"></ion-icon>
</div>
